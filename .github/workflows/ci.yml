name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - name: CPU-only Torch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DOPEN_DEEP_TDA_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(command -v python)"
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - run: deep-tda demo --dataset circle --samples 64 --config configs/quick.json --steps 10 --output outputs/ci-demo
      - name: Build and inspect source distribution / wheel
        run: |
          python -m pip install build
          python -m build
          python tools/check_dist.py dist
      - name: Installed-wheel smoke outside checkout
        shell: bash
        run: |
          python -m venv --system-site-packages /tmp/tda-wheel-env
          /tmp/tda-wheel-env/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/tda-wheel-env/bin/python -c "from pathlib import Path; import open_deep_tda as t; assert Path(t.__file__).resolve().is_relative_to(Path('/tmp/tda-wheel-env').resolve()); from open_deep_tda.datasets import make_dataset; X,_=make_dataset('circle',24,4); m=t.DeepTDA(steps=2,warmup_steps=0,h1_size=8,h0_size=8,evaluation_size=8,subset_bank_size=2).fit(X); assert m.transform(X[:3]).shape==(3,2)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.python }}
          path: outputs/ci-demo/report.html
